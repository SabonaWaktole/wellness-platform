name: CI

# Gates that were previously only ever run by hand. Three separate silent
# breakages of the backend test suite got through because nothing compiled
# `tests/**` except ts-jest at run time (TD-002), and three stale-dependency
# bugs shipped because `npm run lint` warnings were never read (TD-018).
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nevacrm_test
        ports: ['5432:5432']
        # Without the healthcheck the first migration races container startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nevacrm_test?schema=public
      JWT_SECRET: ci-only-secret-not-used-outside-this-job
      JWT_EXPIRATION: 1h
      PORT: '3000'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      # The whole point of TD-002: this compiles tests/**, which tsconfig.json
      # excludes, so a double that has drifted from its interface fails here
      # rather than by silently not running. There is deliberately only ONE
      # typecheck script per package — a weaker src-only variant existing under
      # a similar name is how the wrong one gets run.
      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Migrate test database
        run: npx prisma migrate deploy

      # Both orderings, because per-worker schema isolation is what makes the
      # parallel run trustworthy and a serial-only pass would hide a leak
      # between workers.
      #
      # 4 GB of heap: `npm test` passes --detectOpenHandles, which makes Jest
      # run every suite in one process (TD-034). The Milestone 2 suites took
      # that process past Node's ~2 GB default and it aborted with "heap out of
      # memory" (exit 134) with no test failing.
      - name: Test (parallel)
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Test (serial)
        run: npm test -- --runInBand
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # NFR-OPS-01: the Hostinger target is MySQL, which `prisma migrate deploy`
  # cannot migrate (prisma/migrations is Postgres SQL). The hand-written
  # upgrade script is what production runs, so it is proven here on every
  # change: baseline → upgrade → upgrade again (idempotent) → no drift from
  # schema.mysql.prisma.
  mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wellness
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MYSQL_URL: mysql://root:root@127.0.0.1:3306/wellness

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Import the Hostinger baseline
        run: mysql -h 127.0.0.1 -uroot -proot wellness < prisma/nevacrm_full_import.sql

      - name: Upgrade to current
        run: |
          set -o pipefail
          mysql -h 127.0.0.1 -uroot -proot wellness < prisma/mysql_upgrade_to_current.sql | tee upgrade-1.txt

      # FR-ACT-07, NFR-OPS-02: interactions recorded the pre-Slice-7 way, so
      # the second run has to migrate them as well as skip everything else.
      - name: Plant legacy interactions
        run: mysql -h 127.0.0.1 -uroot -proot wellness < prisma/ci/mysql_fixture_legacy_interactions.sql

      # FR-OFR-08, NFR-OPS-02: quotations without a number, as before Slice 9.
      - name: Plant unnumbered quotations
        run: mysql -h 127.0.0.1 -uroot -proot wellness < prisma/ci/mysql_fixture_legacy_quotations.sql

      - name: Upgrade again (only skips, and migrates the planted interactions and quotations)
        run: |
          set -o pipefail
          mysql -h 127.0.0.1 -uroot -proot wellness < prisma/mysql_upgrade_to_current.sql | tee upgrade-2.txt
          if grep -q 'STILL MISSING' upgrade-2.txt; then
            echo "::error::mysql_upgrade_to_current.sql left objects missing (see the report above)."
            exit 1
          fi

      - name: Legacy interactions were migrated
        run: |
          set -o pipefail
          mysql -h 127.0.0.1 -uroot -proot wellness < prisma/ci/mysql_check_activities.sql | tee check-activities.txt
          if grep -q 'FAIL' check-activities.txt; then
            echo "::error::the interaction migration did not do what FR-ACT-07 requires (see the checks above)."
            exit 1
          fi

      - name: Planted quotations were numbered
        run: |
          set -o pipefail
          mysql -h 127.0.0.1 -uroot -proot wellness < prisma/ci/mysql_check_offer_numbers.sql | tee check-offer-numbers.txt
          if grep -q 'FAIL' check-offer-numbers.txt; then
            echo "::error::the quotation numbering did not do what FR-OFR-08 requires (see the checks above)."
            exit 1
          fi

      - name: No drift from schema.mysql.prisma
        run: npx prisma migrate diff --from-url "$MYSQL_URL" --to-schema-datamodel prisma/schema.mysql.prisma --exit-code

  # NFR-USE-01: every Milestone 1 screen at 360 px, against a real API seeded
  # the way staging is (seed:wellness + seed:uat). Playwright starts both dev
  # servers itself (frontend/playwright.config.ts).
  e2e-mobile:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wellness_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wellness_e2e?schema=public
      JWT_SECRET: ci-only-secret-not-used-outside-this-job
      PORT: '3000'
      SCHEDULER_ENABLED: 'false'
      E2E_ADMIN_EMAIL: admin@wellness-albania.al
      E2E_ADMIN_PASSWORD: CiAdminPassword1
      UAT_PASSWORD: CiUatPassword1
      # The Sales User, Sales Manager and CEO dashboards are those roles' landing pages (M3, NFR-USE-03);
      # seed:uat creates the users with UAT_PASSWORD, and the specs skip a role whose password is not set.
      E2E_SALES_USER_PASSWORD: CiUatPassword1
      E2E_MANAGER_PASSWORD: CiUatPassword1
      E2E_CEO_PASSWORD: CiUatPassword1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Backend — install, migrate, seed
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run seed:wellness -- --owner-email "$E2E_ADMIN_EMAIL" --owner-password "$E2E_ADMIN_PASSWORD"
          npm run seed:uat

      - name: Frontend — install and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Every M1, M2 and M3 screen at 360 px (NFR-USE-01, 02, 03)
        working-directory: frontend
        run: npx playwright test --project=mobile-360

  # FR-BR-04: nothing a Wellness Albania user can reach, and no email the
  # system sends, may name Neva CRM, the SaaS product this edition was forked
  # from. Case-insensitive, so "NevaCRM", "Neva CRM" and "nevacrm.eu" all fail;
  # -I skips binary files such as images. Tests are excluded because they name
  # Neva to assert it is absent, and app.ts because its CORS allowlist is
  # deployment configuration, not text anyone reads.
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Neva branding in the app or its email (FR-BR-04)
        run: |
          if grep -rniI 'neva' \
              --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='app.ts' \
              frontend/index.html frontend/public frontend/src backend/src; then
            echo "::error::Neva branding found above (FR-BR-04). This repository is the Wellness Albania edition."
            exit 1
          fi

  # NFR-MNT-01: every Must requirement in the SRS (scripts/srs-requirements.json)
  # is named by at least one test title, so coverage can be read off the suite.
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Every Must requirement has a test (NFR-MNT-01)
        run: node scripts/check-traceability.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run typecheck` is `tsc -b`. It must stay that way: tsconfig.json
      # here is a solution file with "files": [], so a plain `tsc --noEmit`
      # compiles zero files and exits 0 — a check that cannot fail. TD-028.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails when Albanian, the default language, is missing a key, or when
      # any catalogue keeps a key English no longer has (FR-LNG-02,
      # NFR-I18N-01). The native-review gate is `--strict`, a release check.
      - name: Translation catalogues
        run: npm run check:translations

      - name: Test
        run: npx vitest run
